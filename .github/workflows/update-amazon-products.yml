name: Refresh CatchDeal Product Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

concurrency:
  group: catchdeal-product-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover and rank products from independent web guides
        env:
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/discovery/update_products.py

      - name: Fill remaining images from free licensed web sources
        run: python scripts/discovery/fill_missing_images.py

      - name: Validate generated catalogue if refreshed
        run: |
          if [ ! -f data/products.json ]; then
            echo "No new catalogue was generated. Existing HTML fallback remains live."
            exit 0
          fi
          python - <<'PY'
          import json
          data=json.load(open("data/products.json"))
          products=data.get("products", [])
          assert products, "Generated catalogue is empty"
          assert all(p.get("title") and p.get("category") and p.get("amazonUrl") for p in products), "A product is missing required fields"
          assert all("amazon.in/s?" in p["amazonUrl"] for p in products), "Affiliate destination must be an Amazon India search URL"
          images=sum(bool(p.get("imageUrl")) for p in products)
          print(f"Validated {len(products)} products; {images} have product images.")
          PY

      - name: Publish refreshed catalogue
        run: |
          if [ ! -f data/products.json ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "catchdeal-bot"
          git config user.email "catchdeal-bot@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to publish."
          else
            git commit -m "chore: refresh CatchDeal product picks"
            git push
          fi
